name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Update ESZ notifications data']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Georeferencing reference overlays (scripts/build-georef-overlays.py):
      # PNG tiles too big to commit, so they're built here into data/ and
      # kept in the Actions cache between runs; --all only re-renders PAs
      # whose inputs changed. OSM outlines come from the GeoJSON the update
      # workflow caches (without it, overlays show only gazette table points).
      - name: Restore OSM protected areas GeoJSON
        uses: actions/cache/restore@v4
        with:
          path: .cache/osm/india-protected-areas-all.geojson
          key: osm-protected-areas-none
          restore-keys: osm-protected-areas-

      - name: Restore georeferencing overlays
        uses: actions/cache/restore@v4
        with:
          path: data/georef-overlays
          key: georef-overlays-none
          restore-keys: georef-overlays-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.6'

      - name: Build georeferencing overlays
        run: uv run scripts/build-georef-overlays.py --all

      - name: Save georeferencing overlays
        uses: actions/cache/save@v4
        with:
          path: data/georef-overlays
          key: georef-overlays-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/
          cp README.md _site/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
