name: Update ESZ notifications data

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch source table
        run: npm run fetch

      - name: Parse table
        run: npm run parse

      - name: Clean MoEF data (split multi-park rows, canonicalize names)
        run: npm run clean

      - name: Enrich with Wikidata
        run: npm run enrich:wikidata

      - name: Link Gazette of India archive.org entries
        run: npm run enrich:archive

      # Gazette IIIF manifests rarely change, so they're cached between runs.
      # Allmaps georeferencing is always refetched. Restore and save are split
      # so the cache is saved as soon as the fetch finishes, even if a later
      # step fails or the run is cancelled (actions/cache only saves when the
      # whole job succeeds, so a cold ~50 min fetch was being thrown away).
      - name: Restore gazette manifest cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/gazettes
          key: gazettes-${{ github.run_id }}
          restore-keys: gazettes-

      - name: Build gazette map IIIF collection and mosaic
        run: npm run build:gazette-maps

      - name: Save gazette manifest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/gazettes
          key: gazettes-${{ github.run_id }}

      - name: Install tippecanoe
        run: |
          git clone --depth 1 --branch 2.47.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Build OSM protected areas GeoJSON and MBTiles
        run: npm run build:osm-protected-areas

      # The full OSM GeoJSON stays out of the repo (.cache/osm); the Pages
      # workflow restores it to draw PA outlines on the georeferencing
      # reference overlays (scripts/build-georef-overlays.py).
      - name: Save OSM protected areas GeoJSON for the Pages build
        uses: actions/cache/save@v4
        with:
          path: .cache/osm/india-protected-areas-all.geojson
          key: osm-protected-areas-${{ github.run_id }}

      - name: Build protected areas GeoJSON
        run: npm run build:geojson

      - name: Build full-join dashboard data
        run: npm run build:full-join

      - name: Build source stats summary
        run: npm run build:source-stats

      - name: Build amche-atlas custom atlas JSON
        run: npm run build:atlas

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update ESZ notifications data ($(date -u +%Y-%m-%d))"
            git push
          fi
