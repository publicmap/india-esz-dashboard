name: Update ESZ notifications data

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch source table
        run: npm run fetch

      - name: Parse table
        run: npm run parse

      - name: Clean MoEF data (split multi-park rows, canonicalize names)
        run: npm run clean

      - name: Enrich with Wikidata
        run: npm run enrich:wikidata

      - name: Link Gazette of India archive.org entries
        run: npm run enrich:archive

      - name: Build protected areas GeoJSON
        run: npm run build:geojson

      - name: Build full-join dashboard data
        run: npm run build:full-join

      - name: Build source stats summary
        run: npm run build:source-stats

      - name: Build amche-atlas custom atlas JSON
        run: npm run build:atlas

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update ESZ notifications data ($(date -u +%Y-%m-%d))"
            git push
          fi
